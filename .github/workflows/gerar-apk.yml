name: Gerar APK

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/gerar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gerar-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      AUDIO_FOLDER_ID: ${{ secrets.AUDIO_FOLDER_ID || vars.AUDIO_FOLDER_ID }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar configuracao do Drive
        shell: bash
        run: |
          if [ -z "$DRIVE_API_KEY" ]; then
            echo "::warning::Secret DRIVE_API_KEY ausente. O APK sera compilado, mas a biblioteca precisa dessa chave para acessar o Google Drive."
          fi

      - name: Testar cache de capas
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Licoes-EBD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
