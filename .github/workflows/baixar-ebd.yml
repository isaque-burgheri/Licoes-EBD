name: Baixar audio EBD

# Quando roda:
#  - Toda segunda-feira as 11:00 UTC (08:00 no horario de Brasilia).
#  - Tambem pode ser disparado manualmente na aba "Actions" do GitHub.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

# Permite que o workflow faca commit do baixados.txt de volta no repo.
permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar deno (runtime JS exigido pelo YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp google-api-python-client google-auth

      - name: Preparar cookies do YouTube
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > cookies.txt
            echo "Cookies gravados."
          else
            echo "AVISO: secret YT_COOKIES nao definido; download pode falhar por bloqueio."
          fi

      - name: Baixar audio da licao mais recente
        id: download
        run: python scripts/baixar.py

      - name: Enviar para o Google Drive
        if: steps.download.outputs.baixou == 'sim'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/upload_drive.py "${{ steps.download.outputs.arquivo }}"

      - name: Salvar registro de baixados
        if: steps.download.outputs.baixou == 'sim'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add baixados.txt
          git commit -m "chore: registra licao baixada (${{ steps.download.outputs.nome }})" || echo "nada para commitar"
          git push
