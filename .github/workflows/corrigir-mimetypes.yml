name: Corrigir mimetypes dos audios

# Rodada manual, uma vez so: conserta o mimeType dos audios ja no Drive.
# Depois de rodar e confirmar que deu certo, pode apagar este arquivo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Corrigir mimetypes
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: python scripts/corrigir_mimetypes.py
